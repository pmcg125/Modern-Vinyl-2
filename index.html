<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ModernVinyl2 — 本地黑胶曲库播放器" />
    <meta name="theme-color" content="#050706" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050706'/%3E%3Crect x='5.5' y='5.5' width='21' height='21' fill='none' stroke='%2300ff6a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2300ff6a'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23050706'/%3E%3C/svg%3E"
    />
    <title>MODERNVINYL2 // 本地黑胶曲库</title>
    <script>
      // 首屏前确定主题与动效档位，避免闪白/闪动
      (() => {
        try {
          const raw = localStorage.getItem('mv2:prefs:v1');
          const saved = raw ? JSON.parse(raw) : null;
          const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = saved?.theme ?? system;

          const motion = saved?.motion ?? 'auto';
          const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
          document.documentElement.dataset.motion =
            motion === 'auto' ? (reduce ? 'calm' : 'full') : motion;
        } catch {
          /* 保持默认 dark */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
